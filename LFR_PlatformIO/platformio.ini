; LFR / maze solver — Arduino Nano (ATmega328P), 8 IR sensors on A0–A7
; Original sketch: Rifat Ahmmed. PlatformIO port.
;
; Build:   PlatformIO sidebar → nano_new → Build  (or: pio run)
; Upload:  PlatformIO sidebar → nano_new → Upload (or: pio run -t upload)
; Monitor: PlatformIO sidebar → nano_new → Monitor (or: pio device monitor)
;
; The nano_new environment uses the new bootloader (115200 baud).
; Use the nano environment only for old-bootloader Nano clones.

[platformio]
default_envs = nano_new

[env]
platform = atmelavr
framework = arduino
monitor_speed = 9600
build_flags = -Wall

; Most Nano clones (CH340) — old bootloader, 57600 baud upload
[env:nano]
board = nanoatmega328

; Genuine / newer Nanos — new bootloader, 115200 baud upload
[env:nano_new]
board = nanoatmega328new
upload_port = COM4
extra_scripts = pre:upload_reset.py
